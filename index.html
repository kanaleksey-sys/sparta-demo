<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ХК «Спарта» — любительская хоккейная команда</title>
<meta name="description" content="Любительская хоккейная команда «Спарта»: календарь игр и тренировок, состав, личный кабинет игрока.">
<style>
/* ── цвета команды: заменить на фирменные ── */
:root{--bg:#0a0e16;--card:#131a26;--card2:#182131;--ink:#eef2f8;--mut:#93a0b4;--ac:#e11d48;--ac2:#38bdf8;--line:#223047;--ok:#22c55e;--bad:#fb7185;--tg:#229ED9}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:var(--ac2)}
h1{font-size:54px;line-height:1.05;letter-spacing:-1.5px;font-weight:800}
h2{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:22px}
h3{font-size:18px;font-weight:800;margin-bottom:6px}
p{color:var(--mut)}
.g{background:linear-gradient(90deg,var(--ac),#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;border:1px solid var(--line);background:#ffffff08;color:var(--ac2);font-size:12px;font-weight:700;letter-spacing:1px;padding:7px 14px;border-radius:999px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:13px 24px;border-radius:12px;border:0;cursor:pointer;text-decoration:none;box-shadow:0 10px 30px #e11d4840}
.btn.sec{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.tg{background:var(--tg);box-shadow:0 10px 30px #229ed940}
.btn.del{background:transparent;border:1px solid #fb718555;color:var(--bad);box-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.sec-pad{padding-top:64px;padding-bottom:64px}
table.fit td{white-space:normal}table.fit td:first-child,table.fit td:last-child{white-space:nowrap}

/* шапка */
header.top{position:sticky;top:0;z-index:30;background:#0a0e16e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:800;white-space:nowrap}
.brand svg{width:34px;height:38px;flex:none}
nav.links{display:flex;gap:4px;margin-left:auto}
nav.links a{color:var(--mut);text-decoration:none;font-size:15px;font-weight:600;padding:8px 12px;border-radius:10px}
nav.links a.on,nav.links a:hover{color:var(--ink);background:var(--card2)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.mnav{display:none}

/* главная */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding:60px 0 40px}
.hero .lead{font-size:19px;margin-top:18px;max-width:560px}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.next{background:linear-gradient(160deg,#182131,#1d1420);border:1px solid #e11d4855}
.next .when{font-size:28px;font-weight:800;margin:6px 0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.tr{background:#38bdf822;color:var(--ac2)}.pill.gm{background:#e11d4826;color:#fb7185}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.price{font-size:30px;font-weight:800;margin:6px 0 2px}
.sponsor{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center}
.ph{border:2px dashed #3a4a63;border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:14px;padding:14px;aspect-ratio:16/10}
.ev{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.ev:last-child{border:0}
.ev .d{flex:none;width:58px;text-align:center;background:var(--card2);border-radius:12px;padding:6px 0}.ev .d b{display:block;font-size:22px;line-height:1.1}.ev .d small{font-size:12px;color:var(--mut)}
.ev .t{min-width:0}.ev .t b{display:block}.ev .t span{font-size:14px;color:var(--mut)}

/* календарь */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}.calhead h2{margin:0;flex:1;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:12px;color:var(--mut);text-align:center;font-weight:700;padding:4px 0}
.cal .c{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:0}
.cal .c.out{opacity:.25}.cal .c.today{border-color:var(--ac2)}
.cal .c .n{font-size:13px;font-weight:700;color:var(--mut)}
.cal .e{display:block;width:100%;text-align:left;font:inherit;font-size:12px;font-weight:700;border:0;border-radius:8px;padding:4px 6px;margin-top:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .e.tr{background:#38bdf822;color:var(--ac2)}.cal .e.gm{background:#e11d4830;color:#fda4af}
.legend{display:flex;gap:16px;font-size:14px;color:var(--mut);margin:14px 0 30px}

/* состав */
.pl{display:flex;gap:14px;align-items:center}
.num{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#7f1d1d);display:grid;place-items:center;font-weight:800;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stats small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.stats b{font-size:15px;white-space:nowrap}
.num.n2{background:linear-gradient(135deg,#6366f1,#312e81)}

/* кабинет и админка */
.big{font-size:44px;font-weight:800;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font:inherit;font-size:14px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
.tabs button.on{color:#fff;background:var(--ac);border-color:var(--ac)}
.tw{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;background:var(--card2)}
tr:last-child td{border-bottom:0}td.r,th.r{text-align:right}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
.form label{font-size:13px;font-weight:700;color:var(--mut);display:block}
.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:15px}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:0}.chk input{width:18px;height:18px;accent-color:var(--ac)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.badge.sub{color:var(--ac2);border-color:#38bdf855}.badge.rent{color:#fbbf24;border-color:#fbbf2455}
.badge.role-G{color:#fbbf24;border-color:#fbbf2466}.badge.role-F{color:#fda4af;border-color:#fb718566}.badge.role-D{color:#7dd3fc;border-color:#38bdf866}
.badge.sq1{color:#fda4af;border-color:#e11d4866}.badge.sq2{color:#a5b4fc;border-color:#818cf866}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips button{font:inherit;font-size:14px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}.chips button.on{color:var(--ink);border-color:var(--ac2);background:#38bdf81a}
.rsvp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.rsvp button{font:inherit;font-size:13px;font-weight:700;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.rsvp .r-yes.on{background:#22c55e26;color:var(--ok);border-color:#22c55e88}.rsvp .r-maybe.on{background:#fbbf2422;color:#fbbf24;border-color:#fbbf2488}.rsvp .r-no.on{background:#fb718522;color:var(--bad);border-color:#fb718588}
.nk{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}.nk.ok{background:#22c55e22;color:var(--ok)}.nk.bad{background:#fb718522;color:var(--bad)}.nk.warn{background:#fbbf2422;color:#fbbf24}.nit{padding:10px 0;border-bottom:1px solid var(--line)}.nit:last-child{border:0}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.chk.on{background:#38bdf81a}
.cap{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;background:#fbbf24;color:#111;font-size:12px;font-weight:900;vertical-align:2px;margin-left:4px}
.mchip{display:inline-block;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:13px;font-weight:700;cursor:pointer;user-select:none}.mchip.cur{border-style:dashed}.mchip.on{border-color:var(--ac2);background:#38bdf826;color:var(--ink)}.mchip.paid{opacity:.45;cursor:default;color:var(--ok)}.mchip input{display:none!important}.form label.mchip{display:inline-block;margin:0;font-size:13px}
.place{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--ac2)}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;margin-right:6px}.mk.yes{background:#22c55e26;color:var(--ok)}.mk.maybe{background:#fbbf2422;color:#fbbf24}.mk.no{background:#fb718522;color:var(--bad)}.mk.none{background:var(--card2);color:var(--mut)}
.lines{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.line h4{font-size:14px;margin-bottom:8px;color:var(--mut)}
.slot{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;margin-bottom:6px}.slot b{font-size:12px;color:var(--mut)}
.slot select,.tsel{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;font-size:14px}
.grp{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}.sw input{width:18px;height:18px;accent-color:var(--ac)}
.form label.sw{display:flex;font-weight:600;color:var(--ink)}.form .sw input{display:inline-block;width:18px;flex:none;margin:0;padding:0}

/* модалка, тост, демо */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;max-width:460px;width:100%;max-height:90vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:14px;top:10px;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer}
.pick{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:8px;cursor:pointer}
.pick:hover{border-color:var(--ac2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#06210f;font-weight:800;padding:12px 20px;border-radius:12px;z-index:60;transition:transform .25s}
.toast.on{transform:translateX(-50%) translateY(0)}
.demo{position:fixed;left:14px;bottom:14px;z-index:40;background:#fbbf24;color:#2a1c00;font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px}
footer{border-top:1px solid var(--line);padding:30px 0;color:#6b7891;font-size:13px;text-align:center;margin-top:40px}

@media(max-width:900px){nav.links{display:none}.mnav{display:flex;gap:4px;overflow-x:auto;padding:8px 20px;border-top:1px solid var(--line)}.mnav a{color:var(--mut);text-decoration:none;font-size:14px;font-weight:600;padding:7px 12px;border-radius:10px;white-space:nowrap}.mnav a.on{color:var(--ink);background:var(--card2)}.who{margin-left:auto}}
@media(max-width:760px){
 h1{font-size:36px}h2{font-size:24px}.sec-pad{padding-top:44px;padding-bottom:44px}
 .card{padding:18px}th,td{padding:10px 9px}.kpis{gap:12px}.grid3>*{grid-column:auto!important}.lines{grid-template-columns:1fr}
 .hero,.grid3,.grid4,.sponsor,.kpis{grid-template-columns:1fr}.hero{padding:36px 0 20px;gap:24px}
 .form{grid-template-columns:1fr 1fr}.form .w2{grid-column:1/-1}
 .cal{gap:3px}.cal .c{min-height:58px;padding:4px;border-radius:8px}.cal .e{font-size:0;height:7px;padding:0;margin-top:3px}
 .big{font-size:36px}.who .nm{display:none}footer{padding-bottom:64px}
}
</style></head><body>

<header class="top"><div class="wrap">
<a class="brand" href="#home"><svg viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32 6v12c0 9-6.5 15.5-15 19C8.5 33.5 2 27 2 18V6z" fill="#e11d48"/><path d="M17 5 28 9v9c0 7-4.8 12-11 15C10.8 30 6 25 6 18V9z" fill="#0a0e16"/><text x="17" y="25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Arial">С</text></svg>ХК «Спарта»</a>
<nav class="links" id="nav"></nav>

</div><nav class="mnav" id="mnav"></nav></header>

<main id="app"></main>

<footer><div class="wrap">
<p>ХК «Спарта» · любительская хоккейная команда · &lt;город&gt;</p>
<p style="margin-top:6px">Демо-концепция: данные условные и хранятся только в Вашем браузере. Логотип, цвета и спонсор — заглушки.</p>
</div></footer>

<div class="modal" id="modal"><div class="box"><button class="x" data-act="close" aria-label="Закрыть">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══ данные ═══ */
const KEY='sparta-demo-v9', UKEY='sparta-demo-user';
const TYPES={single:'Разовый',sub:'Абонемент'};
const POS={F:'Нападающий',D:'Защитник',G:'Вратарь'};
const POS_PL={F:'Нападающие',D:'Защитники',G:'Вратари'};
const SQ={all:'Оба состава','1':'1-й состав','2':'2-й состав'};const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW=['пн','вт','ср','чт','пт','сб','вс'];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date()), CUR=TODAY.slice(0,7);
const money=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dobj=s=>new Date(s+'T00:00');
const fdate=s=>{const d=dobj(s);return d.getDate()+' '+MONTHS_G[d.getMonth()]};
const fdow=s=>DOW[(dobj(s).getDay()+6)%7];
const age=b=>{if(!b)return null;const d=dobj(b),t=dobj(TODAY);let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a};
const yrs=n=>{const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'год':a>=2&&a<=4&&(b<10||b>=20)?'года':'лет')};
const fbirth=b=>b?fdate(b)+' '+b.slice(0,4):'';
const mname=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(0,4);
const uid=()=>Math.random().toString(36).slice(2,9);
const plusMonth=s=>{const d=dobj(s),day=d.getDate();d.setMonth(d.getMonth()+1);if(d.getDate()!==day)d.setDate(0);return iso(d)};  // 31.01 → 28.02
const minusDay=s=>{const d=dobj(s);d.setDate(d.getDate()-1);return iso(d)};
const addM=(m,k)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};

function seed(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()-1);   // с начала прошлого месяца
  const end=new Date(base); end.setMonth(end.getMonth()+3);
  const players=[
    ['Смирнов','Алексей',17,'F','sub'],['Кузнецов','Дмитрий',9,'F','sub'],['Попов','Сергей',44,'D','single'],
    ['Васильев','Андрей',31,'G','sub'],['Новиков','Илья',88,'F','rent'],['Фёдоров','Максим',5,'D','single'],
    ['Морозов','Павел',21,'F','sub'],['Волков','Артём',12,'D','single'],['Алексеев','Роман',71,'F','rent'],
    ['Лебедев','Игорь',3,'D','sub'],['Семёнов','Никита',27,'F','single'],['Егоров','Денис',1,'G','single']
  ].map((p,i)=>({id:'p'+(i+1),last:p[0],first:p[1],mid:'',num:p[2],pos:p[3],type:p[4],squad:i<7?'1':'2',phone:'+7 900 000-00-'+pad(i+1),
    birth:(1978+(i*3)%22)+'-'+pad(1+(i*5)%12)+'-'+pad(3+(i*7)%25),height:172+(i*7)%20,weight:74+(i*9)%26}));
  const events=[];
  for(let d=new Date(base);d<end;d.setDate(d.getDate()+1)){
    const w=d.getDay();
    if(w===2||w===4)events.push({id:uid(),type:'training',squad:'all',date:iso(d),time:'21:15',place:'Ледовая арена (адрес условный)'});
  }
  const opp=['Северные волки','Металлург-Л','Айсберг','Тигры','Ледокол'];let k=0;
  for(let d=new Date(base);d<end;d.setDate(d.getDate()+1)){
    if(d.getDay()===6&&d.getDate()%14<7){const ds=iso(d),past=ds<TODAY;
      events.push({id:uid(),type:'game',squad:k%2?'2':'1',date:ds,time:'18:00',place:'Ледовая арена (адрес условный)',opp:opp[k%opp.length],score:past?['4:2','3:5','6:6','2:1'][k%4]:''});k++}
  }
  const att={};
  events.forEach((e,ei)=>{ if(e.date>=TODAY)return;
    att[e.id]=players.filter((p,pi)=>(e.squad==='all'||e.squad===p.squad)&&((pi*7+ei*3)%10)<(p.type==='sub'?8:5)).map(p=>p.id)});
  const payments=[];const m0=iso(base).slice(0,7);
  players.forEach((p,i)=>{
    if(p.type==='sub'){const day=pad([1,2,1,5][i%4]), d1=m0+'-'+day, d2=plusMonth(d1);
      payments.push({id:uid(),pid:p.id,date:d1,amount:6000,kind:'sub',note:''});
      if(i%3!==1&&d2<=TODAY)payments.push({id:uid(),pid:p.id,date:d2,amount:6000,kind:'sub',note:''})}
    else payments.push({id:uid(),pid:p.id,date:m0+'-20',amount:[3000,5000,4000,6000][i%4],kind:'single',note:''});
  });
  const nextTr=events.find(e=>e.type==='training'&&e.date>=TODAY);
  const requests=[

function calendar(){
  const y=+calM.slice(0,4), m=+calM.slice(5)-1, first=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const evs=sorted().filter(e=>e.date.startsWith(calM)&&forSquad(e,calSq));
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="c out"></div>';
  for(let d=1;d<=days;d++){const ds=calM+'-'+pad(d);
    const de=evs.filter(e=>e.date===ds);cells+=`<div class="c${ds===TODAY?' today':''}"${de.length?` data-act="event" data-id="${de[0].id}" style="cursor:pointer"`:''}><div class="n">${d}</div>${evs.filter(e=>e.date===ds).map(e=>`<button class="e ${e.type==='game'?'gm':'tr'}" data-act="event" data-id="${e.id}">${e.type==='game'?'Игра'+(sqOf(e)!=='all'?' ('+sqOf(e)+'-й)':'')+' · '+esc(e.opp):'Тренировка '+esc(e.time)+(sqOf(e)!=='all'?' ('+sqOf(e)+'-й)':'')}</button>`).join('')}</div>`}

let lineEv=null;
const RORD={yes:0,maybe:1,'':2,no:3};
function lineupView(e){const L=D.lineup[e.id];if(!L||!L.pub)return '';
  if(e.type!=='game'){const T=trTeams(e),PO={G:0,D:1,F:2},used=new Set(Object.keys(T));
    if(!used.size)return '';
    const col=t=>{const ps=invited(e).filter(p=>T[p.id]===t).sort((a,b)=>PO[a.pos]-PO[b.pos]||a.last.localeCompare(b.last));
      return `<div class="line" style="margin-top:10px"><h4 style="margin-bottom:2px">${TEAMS[t]} · ${ps.length}</h4>${ps.map(p=>`<div class="row" style="padding:3px 0;gap:8px"><span class="badge" style="width:34px;text-align:center">${{G:'Вр',D:'З',F:'Н'}[p.pos]}</span><span>${esc(p.last)} ${esc(p.first[0])}. <span class="mut">${numT(p)}</span></span></div>`).join('')||'<p class="mut">Пока никого</p>'}</div>`};
    const rest=invited(e).filter(p=>rsvpOf(e.id,p.id)==='yes'&&!used.has(p.id));
    return `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><h3>Команды на тренировку</h3>${col('A')}${col('B')}${rest.length?`<p class="note">Без команды: ${rest.map(p=>esc(p.last)+' '+numT(p)).join(', ')}</p>`:''}</div>`}
  const S=gameSlots(e),nm=id=>{const p=player(id);return p?esc(p.last)+' '+esc(p.first[0])+'. <span class="mut">'+numT(p)+'</span>'+capMark(p):''};
  const row=(ab,id)=>id?`<div class="row" style="padding:3px 0;gap:8px"><span class="badge" style="width:34px;text-align:center">${ab}</span><span>${nm(id)}</span></div>`:'';
  const G=row('Осн.',S.G1)+row('Зап.',S.G2);
  const lines=LINES.map(n=>{const r=LPOS.map(([k,ab])=>row(ab,S[n+'-'+k])).join('');return r?`<div class="line" style="margin-top:10px"><h4 style="margin-bottom:2px">${n}-е звено</h4>${r}</div>`:''}).join('');
  const used=new Set(Object.values(S)),bench=invited(e).filter(p=>rsvpOf(e.id,p.id)==='yes'&&!used.has(p.id));
  if(!G&&!lines)return '';
  return `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><h3>Состав на игру</h3>${G?`<div class="line" style="margin-top:10px"><h4 style="margin-bottom:2px">Вратари</h4>${G}</div>`:''}${lines}${bench.length?`<p class="note">В запасе: ${bench.map(p=>esc(p.last)+' '+numT(p)).join(', ')}</p>`:''}</div>`}
function autoLine(eid){
  const e=D.events.find(x=>x.id===eid);if(!e)return;
  const cand=invited(e).filter(p=>rsvpOf(eid,p.id)==='yes').sort((a,b)=>RORD[rsvpOf(eid,a.id)]-RORD[rsvpOf(eid,b.id)]);
  const by=k=>cand.filter(p=>p.pos===k);
  if(e.type==='game'){
    const G=by('G'),Dd=by('D'),F=by('F'),s={};
    if(G[0])s.G1=G[0].id;if(G[1])s.G2=G[1].id;
    LINES.forEach(n=>{['LD','RD'].forEach(k=>{const p=Dd.shift();if(p)s[n+'-'+k]=p.id});['C','LW','RW'].forEach(k=>{const p=F.shift();if(p)s[n+'-'+k]=p.id})});
    D.lineup[eid]={slots:s,pub:false};
  }else{
    const t={};[...by('G'),...by('D'),...by('F')].forEach((p,i)=>t[p.id]=i%2?'B':'A');
    D.lineup[eid]={teams:t,pub:false};
  }
}
function tLine(){
  const list=sorted().filter(e=>e.date>=TODAY).slice(0,10);
  if(!list.length)return '<div class="card"><p>Ближайших событий нет — добавьте их во вкладке «События».</p></div>';

  const e=D.events.find(x=>x.id===lineEv), inv=invited(e), L=D.lineup[e.id]||{};
  const grp={yes:[],maybe:[],'':[],no:[]};inv.forEach(p=>grp[rsvpOf(e.id,p.id)].push(p));
  const mk=r=>`<span class="mk ${r||'none'}">${r?RSVP_IC[r]:'—'}</span>`;
  const PORD={G:0,F:1,D:2};   // вратари → нападающие → защитники
  const ordered=[...inv].sort((a,b)=>PORD[a.pos]-PORD[b.pos]||RORD[rsvpOf(e.id,a.id)]-RORD[rsvpOf(e.id,b.id)]||a.last.localeCompare(b.last));
  const role=p=>`<span class="badge role-${p.pos}">${POS[p.pos]}</span>`;
  const opt=sel=>`<option value="">—</option>`+['G','F','D'].map(k=>{const L=ordered.filter(p=>p.pos===k&&rsvpOf(e.id,p.id)==='yes');return L.length?`<optgroup label="${POS_PL[k]}">${L.map(p=>`<option value="${p.id}"${sel===p.id?' selected':''}>${RSVP_IC[rsvpOf(e.id,p.id)]||'·'} ${esc(p.last)} ${esc(p.first)} ${numT(p)} — ${POS[p.pos].toLowerCase()}</option>`).join('')}</optgroup>`:''}).join('');
  const S=gameSlots(e), T=trTeams(e);
  const editor=e.type==='game'
   ?`<div class="line" style="margin-bottom:14px"><h4>Вратари</h4><div class="lines">${[['G1','Осн.'],['G2','Зап.']].map(([k,t])=>`<div class="slot"><b>${t}</b><select class="slotSel" data-slot="${k}">${opt(S[k])}</select></div>`).join('')}</div></div>
     <div class="lines">${LINES.map(n=>`<div class="card line" style="padding:14px"><h4>${n}-е звено</h4>${LPOS.map(([k,ab])=>`<div class="slot"><b>${ab}</b><select class="slotSel" data-slot="${n}-${k}">${opt(S[n+'-'+k])}</select></div>`).join('')}</div>`).join('')}</div>

  else if(a==='attSave'){D.att[attEv]=[...document.querySelectorAll('.attCb:checked')].map(c=>c.value);const rc=[...document.querySelectorAll('.rentCb:checked')].map(c=>c.value).filter(id=>D.att[attEv].includes(id));if(document.querySelector('.rentCb'))D.rentAtt[attEv]=rc;save();toast('Посещения сохранены'+(rc.length?' · аренда: '+rc.length:''));render()}
  else if(a==='payDel'){if(confirm('Удалить эту оплату?')){D.payments=D.payments.filter(x=>x.id!==id);if(payEdit===id)payEdit=null;save();render()}}
  else if(a==='payEdit'){payEdit=id;render();scrollTo({top:0,behavior:'smooth'})}
  else if(a==='payCancel'){payEdit=null;render()}
  else if(a==='evEdit'){evEdit=id;render();scrollTo({top:0,behavior:'smooth'})}
  else if(a==='evCancel'){evEdit=null;render()}
  else if(a==='evDel'){if(confirm('Удалить событие? Отметки посещений по нему тоже удалятся.')){D.events=D.events.filter(x=>x.id!==id);delete D.att[id];save();render()}}
  else if(a==='plDel'){if(confirm('Удалить игрока и его оплаты?')){D.players=D.players.filter(p=>p.id!==id);D.payments=D.payments.filter(x=>x.pid!==id);Object.keys(D.att).forEach(k=>D.att[k]=D.att[k].filter(x=>x!==id));save();render()}}
  else if(a==='csv'){const rows=[['Фамилия','Имя','Отчество','Состав','Тип','Тренировок','Начислено','Внесено','Баланс','Абонемент']].concat(balances().map(({p,L})=>[p.last,p.first,p.mid||'',(p.squad||'1')+'-й',TYPES[p.type],L.trCount,L.charged,L.paid,L.bal,L.sub?subText(L):'']));
    const blob=new Blob(['﻿'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='sparta-balansy-'+TODAY+'.csv';l.click();URL.revokeObjectURL(u)}
  else if(a==='reset'){if(confirm('Сбросить все демо-данные?')){D=seed();save();toast('Демо-данные сброшены');render()}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='attSel'){attEv=t.value;render()}
  else if(t.id==='planSel'){planEv=t.value;render()}
  else if(t.id==='payFP'){payF.pid=t.value;render()}
  else if(t.id==='payFM'){payF.m=t.value;render()}
  else if(t.id==='tourSel'){tourSel=t.value;tourEdit=false;render()}
  else if(t.classList.contains('tpSel')){const a=D.tpart[tourSel]=D.tpart[tourSel]||{};if(t.value)a[t.dataset.pid]=t.value;else delete a[t.dataset.pid];save();render()}
  else if(t.classList.contains('docUp')&&t.files[0]){if(!myPid())return;const f=t.files[0],k=t.dataset.k,tr=D.tours.find(x=>x.id===t.dataset.t),u=$('du_'+t.dataset.t+'_'+k);if(!tr)return;
    if(DOCT[k].exp&&!(u&&u.value)){toast('Сначала укажите, до какой даты действует документ');t.value='';return}
    readDoc(f).then(file=>{const box=dbox(tr,myPid()),old=box[k];
      box[k]={file,name:f.name,date:TODAY,until:u?u.value:'',status:'sent',note:''};
      if(!save()){if(old)box[k]=old;else delete box[k];toast('Не хватило места в демо — загрузите фото поменьше');return}
      toast('Документ отправлен на проверку');render()}).catch(m=>{t.value='';toast(String(m))})}
  else if(t.id==='drLibSel'&&t.value!==''){const d=D.drillLib[+t.value];plan(planEv).drills.push({id:uid(),text:d.text,min:d.min});save();render()}
  else if(t.classList.contains('attCb'))$('attCnt').textContent=document.querySelectorAll('.attCb:checked').length;
  else if(t.id==='repSel'){repM=t.value;render()}
  else if(t.classList.contains('plType')){const p=player(t.dataset.id);p.type=t.value;save();toast('Тип участия изменён')}
  else if(t.id==='lineSel'){lineEv=t.value;render()}
  else if(t.classList.contains('slotSel')){const L=D.lineup[lineEv]=D.lineup[lineEv]||{};L.slots=L.slots||{};
    if(t.value)Object.keys(L.slots).forEach(k=>{if(L.slots[k]===t.value)delete L.slots[k]});
    if(t.value)L.slots[t.dataset.slot]=t.value;else delete L.slots[t.dataset.slot];save();render()}
  else if(t.classList.contains('tsel')){const L=D.lineup[lineEv]=D.lineup[lineEv]||{};L.teams=L.teams||{};
    if(t.value)L.teams[t.dataset.pid]=t.value;else delete L.teams[t.dataset.pid];save();render()}
  else if(t.classList.contains('rqSt')){D.requests.find(r=>r.id===t.dataset.id).status=t.value;save();render()}
  else if(t.classList.contains('plSq')){const p=player(t.dataset.id);p.squad=t.value;save();toast('Игрок переведён в '+SQ[t.value])}
  else if(t.name&&/^[mt]_/.test(t.name)&&t.form){t.closest('label').classList.toggle('on',t.checked);payFormSync(t.form,true)}
  else if(t.form&&t.form.id==='payForm'&&['pid','kind','date','amount'].includes(t.name)){const f=t.form,pl=player(f.pid.value);
    if(t.name==='pid')f.kind.value=f.pid.selectedOptions[0].dataset.t==='sub'?'sub':'single';
    if(t.name==='pid'||t.name==='kind'){$('payMonths').outerHTML=monthsBox(pl,f.kind.value==='sub'?suggestMonths(pl,1):[],payEdit,'payMonths',f.kind.value==='sub');
      $('payTrs').outerHTML=trBox(pl,f.kind.value==='single'?suggestTrs(pl):[],payEdit,'payTrs',f.kind.value==='single')}
    if(t.name==='kind'||t.name==='pid'){f.dataset.keep=t.name==='kind'&&f.kind.value==='single'?'1':'';f.dataset.auto=''}
    if(t.name==='amount'&&autoSub(f))return;
    payFormSync(f,t.name==='pid'||t.name==='kind')}
  else if(t.form&&t.form.id==='phForm'&&['kind','amount'].includes(t.name)){const f=t.form;if(t.name==='kind'){f.dataset.keep=f.kind.value==='single'?'1':'';f.dataset.auto=''}
    if(t.name==='amount'&&autoSub(f))return;payFormSync(f,t.name==='kind')}
});
document.addEventListener('submit',ev=>{
  const f=ev.target;ev.preventDefault();const v=Object.fromEntries(new FormData(f));
  if(f.id==='docForm'){if(!isStaff())return;const st=ev.submitter&&ev.submitter.value,pid=f.dataset.pid,k=f.dataset.k,t=D.tours.find(x=>x.id===tourSel);if(!t)return;
    if(st==='bad'&&!v.note.trim()){toast('Напишите причину отказа — игрок её увидит');return}
    if(st==='ok'&&DOCT[k].exp&&!v.until){toast('Укажите, до какой даты действует документ');return}
    const box=dbox(t,pid),d=box[k]=box[k]||{file:'',name:'',date:TODAY,until:'',note:''};d.status=st;d.note=st==='bad'?v.note.trim():'';if('until' in v)d.until=v.until;
    save();closeModal();toast(st==='ok'?(admitted(t,pid)?'Принято — игрок допущен к турниру':'Документ принят'):'Отклонено — игрок увидит причину');render();return}
  if(f.id==='invForm'){const iv=D.invites[f.dataset.code],x=iv&&whoOf(iv),err=$('invErr');if(!x){render();return}
    if(v.pw.length<6){err.textContent='Пароль — не меньше 6 символов';err.style.display='block';return}
    if(v.pw!==v.pw2){err.textContent='Пароли не совпадают';err.style.display='block';return}
    x.pwh=pwHash(v.pw);delete D.invites[f.dataset.code];save();
    setUser(iv.pid?(x.cap==='C'?{role:'admin'}:{role:'player',pid:iv.pid}):{role:'coach',cid:iv.cid});toast('Пароль сохранён — добро пожаловать!');location.hash=iv.pid?'#cabinet':'#admin';return}
  if(f.id==='dtForm'){if(!isStaff())return;const name=v.t.trim(),url=v.url.trim();if(!name){toast('Укажите название');return}
    if(url&&!/^https?:\/\/\S+$/i.test(url)){toast('Ссылка должна начинаться с https://');return}
    let d=f.dataset.id?DOCT[f.dataset.id]:null;if(!d&&D.doctypes.some(x=>x.t.toLowerCase()===name.toLowerCase())){toast('Такой документ уже есть в справочнике');return}
    if(!d){d={id:'c'+uid()};D.doctypes.push(d)}
    Object.assign(d,{t:name,hint:v.hint.trim(),url,exp:!!v.exp,paper:!!v.paper});
    const t=v.addTour&&tourSel&&tourSel!=='new'?D.tours.find(x=>x.id===tourSel):null;if(t&&!t.docs.includes(d.id))t.docs.push(d.id);
    dtEdit=null;syncDocT();save();toast(f.dataset.id?'Сохранено':t?'Документ добавлен и требуется в турнире':'Документ добавлен в справочник');render();return}
  if(f.id==='tourForm'){const docs=Object.keys(DOCT).filter(k=>v['doc_'+k]);if(!v.name.trim()){toast('Укажите название турнира');return}if(!docs.length){toast('Отметьте хотя бы один документ');return}
    let t=tourSel&&tourSel!=='new'?D.tours.find(x=>x.id===tourSel):null;if(!t){t={id:uid()};D.tours.push(t)}
    Object.assign(t,{name:v.name.trim(),squad:v.squad,due:v.due||'',fee:+v.fee||0,docs});
    D.events.forEach(e=>{if(e.type!=='game')return;if(v['g_'+e.id])e.tid=t.id;else if(e.tid===t.id)e.tid=''});
    tourSel=t.id;tourEdit=false;save();toast('Турнир сохранён');render();return}
  if(f.id==='pnForm'){if(!v.text.trim())return;(D.notes[pnP]=D.notes[pnP]||[]).push({id:uid(),date:TODAY,kind:v.kind,vis:v.vis,text:v.text.trim(),done:false});save();toast(v.vis==='player'?'Заметка добавлена — игрок её увидит':'Заметка добавлена');render();return}
  if(f.id==='drForm'){if(!v.text.trim())return;plan(planEv).drills.push({id:uid(),text:v.text.trim(),min:+v.min||0});save();render();return}
  if(f.id==='tacForm'){const P=plan(planEv);P.opp=v.opp.trim();P.tactic=v.tactic.trim();LINES.forEach(n=>P.lines[n]=(v['l'+n]||'').trim());save();toast('Тактика сохранена');render();return}
  if(f.id==='afForm'){if(!v.text.trim())return;plan(planEv).after.push({id:uid(),kind:v.kind,text:v.text.trim(),moved:false});save();render();return}
  if(f.id==='joinForm'){const err=$('joinErr'), ph=v.phone.replace(/\D/g,'');
    if(v.name.trim().length<3){err.textContent='Укажите фамилию и имя';err.style.display='block';return}
    if(ph.length<10){err.textContent='Проверьте номер телефона';err.style.display='block';return}
    if(!v.consent){err.textContent='Нужно согласие на обработку данных';err.style.display='block';return}
    D.requests.push({id:uid(),date:TODAY,name:v.name.trim(),phone:v.phone.trim(),age:v.age,level:v.level,gear:!!v.gear,ev:v.ev,note:v.note.trim(),status:'new'});
    save();joinDone=true;render();scrollTo(0,0);return}
  if(f.id==='loginForm'){const ph=v.phone.replace(/\D/g,'').replace(/^8/,'7');
    if(ph==='79000000000'&&v.pw==='0000'){setUser({role:'admin'});closeModal();location.hash='#admin';render();return}
    const c=D.coaches.find(x=>(x.phone||'').replace(/\D/g,'')===ph);
    if(c&&(c.pwh?pwHash(v.pw)===c.pwh:v.pw==='2222')){setUser({role:'coach',cid:c.id});closeModal();location.hash='#admin';render();return}
    const p=D.players.find(x=>(x.phone||'').replace(/\D/g,'')===ph);
    if(p&&(p.pwh?pwHash(v.pw)===p.pwh:v.pw==='1111')){setUser(p.cap==='C'?{role:'admin'}:{role:'player',pid:p.id});closeModal();location.hash=p.cap==='C'?'#admin':'#cabinet';render();return}
    $('loginErr').style.display='block';return}
  if(f.id==='phForm'){if(!U||U.role!=='admin')return;if(autoSub(f)){toast('Сумма — как абонемент: проверьте месяц и нажмите ещё раз');return}const ms=Object.keys(v).filter(k=>k.startsWith('m_')).map(k=>k.slice(2)).sort(),ts=Object.keys(v).filter(k=>k.startsWith('t_')).map(k=>k.slice(2));if(v.kind==='single'&&!ts.length){toast('Отметьте, за какие тренировки оплата');return}
    const d={pid:f.dataset.pid,date:v.date,amount:Math.round(+v.amount),kind:v.kind,note:v.note.trim(),months:v.kind==='sub'?ms:undefined,trs:v.kind==='single'?ts:undefined};
    if(!(d.amount>0)){toast('Укажите сумму');return}if(d.kind==='sub'&&!ms.length){toast('Отметьте, за какие месяцы оплата');return}
    const pl=player(d.pid);let x=f.dataset.id&&D.payments.find(y=>y.id===f.dataset.id);const before=paySnap(pl,x&&x.id);
    if(x)Object.assign(x,d);else{x={id:uid(),...d};D.payments.push(x)}if(!x.months)delete x.months;if(!x.trs)delete x.trs;
    phMsg=snapDiff(before,paySnap(pl,x.id),x);toast(f.dataset.id?'Платёж исправлен':'Платёж добавлен');
    save();render();openPayHist(d.pid,null);return}
  if(f.id==='payForm'){if(autoSub(f)){toast('Сумма — как абонемент: проверьте месяц и нажмите ещё раз');return}const ms=Object.keys(v).filter(k=>k.startsWith('m_')).map(k=>k.slice(2)).sort(),ts=Object.keys(v).filter(k=>k.startsWith('t_')).map(k=>k.slice(2));if(v.kind==='single'&&!ts.length){toast('Отметьте, за какие тренировки оплата');return}if(v.kind==='sub'&&!ms.length){toast('Отметьте, за какие месяцы оплата');return}
    const d={pid:v.pid,date:v.date,amount:Math.round(+v.amount),kind:v.kind,note:v.note.trim(),months:v.kind==='sub'?ms:undefined,trs:v.kind==='single'?ts:undefined};const e=payEdit&&D.payments.find(x=>x.id===payEdit);
    if(e){const pl=player(d.pid),b0=paySnap(pl,e.id);Object.assign(e,d);if(!e.months)delete e.months;if(!e.trs)delete e.trs;payEdit=null;phMsg=snapDiff(b0,paySnap(pl,e.id),e);save();render();openPayHist(d.pid,null);toast('Оплата исправлена');return}
    const x={id:uid(),...d};if(!x.months)delete x.months;if(!x.trs)delete x.trs;D.payments.push(x);toast('Оплата записана'+(x.months?' — за '+mList(x.months):''));save();render()}
  else if(f.id==='evForm'){const e={type:v.type,squad:v.squad,date:v.date,time:v.time,place:v.place.trim(),opp:v.opp.trim(),score:v.score.trim()};
    if(e.type==='game'&&!e.opp){alert('Укажите соперника');return}
    e.tid=e.type==='game'&&v.tid?v.tid:'';
    if(evEdit){Object.assign(D.events.find(x=>x.id===evEdit),e);evEdit=null;save();toast('Событие сохранено');render();return}
    if(v.rep){   // серия: тот же день недели каждую неделю до даты «до»
      if(!v.until||v.until<e.date){alert('Укажите дату «до», не раньше первой даты');return}
      let d=e.date,n=0,skip=0;
      for(let i=0;i<60&&d<=v.until;i++){
        if(D.events.some(x=>x.type===e.type&&x.date===d&&x.time===e.time&&sqOf(x)===e.squad))skip++;else{D.events.push({id:uid(),...e,date:d});n++}
        const t=dobj(d);t.setDate(t.getDate()+7);d=iso(t)}
      save();toast(`Добавлено: ${n} — по ${['воскресеньям','понедельникам','вторникам','средам','четвергам','пятницам','субботам'][dobj(e.date).getDay()]} в ${e.time}`+(skip?`, уже было: ${skip}`:''));render();return}
    D.events.push({id:uid(),...e});save();toast('Событие сохранено');render()}
  else if(f.id==='coForm'){D.coaches.push({id:uid(),last:v.last.trim(),first:v.first.trim(),mid:v.mid.trim(),role:v.role.trim(),squad:v.squad,phone:v.phone.trim(),about:v.about.trim()});save();toast('Тренер добавлен');render()}
  else if(f.id==='plForm'){const d={last:v.last.trim(),first:v.first.trim(),mid:v.mid.trim(),num:v.num===''?'':+v.num,pos:v.pos,type:v.type,squad:v.squad,phone:v.phone.trim(),
      birth:v.birth,height:v.height?+v.height:'',weight:v.weight?+v.weight:'',cap:v.cap||'',gear:!!v.gear};
    if(d.cap==='C')D.players.forEach(x=>{if(x.cap==='C'&&x.id!==plEdit)x.cap=''});   // капитан один
    if(plEdit){Object.assign(player(plEdit),d);plEdit=null;toast('Данные игрока сохранены')}else{D.players.push({id:uid(),...d});toast('Игрок добавлен')}save();render()}
  else if(f.id==='meForm'){const p=player(myPid());p.birth=v.birth;p.height=v.height?+v.height:'';p.weight=v.weight?+v.weight:'';save();toast('Данные сохранены');render()}
  else if(f.id==='setForm'){D.settings={...D.settings,single:+v.single,sub:+v.sub,rent:+v.rent};save();toast('Настройки сохранены');render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
addEventListener('hashchange',()=>{closeModal();render();scrollTo(0,0)});
render();
